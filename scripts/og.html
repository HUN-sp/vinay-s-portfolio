<!doctype html>
<!-- Source for public/og.png. Render at 1200x630 (see README, "Open Graph image"). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Instrument Serif'; src: url('../src/assets/fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Geist'; src: url('../src/assets/fonts/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('../src/assets/fonts/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #0d0e10; color: #ecebe7; font-family: 'Geist', sans-serif; position: relative; overflow: hidden; }
  .frame { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; }
  .status { font-family: 'Geist Mono', monospace; font-size: 24px; color: #b9bdc4; display: inline-flex; align-items: center; gap: 14px; border: 1px solid #272b34; background: #14161a; padding: 12px 22px; border-radius: 999px; align-self: flex-start; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #f2b45b; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 118px; line-height: 1; letter-spacing: -0.01em; }
  p.pos { margin-top: 28px; font-size: 34px; line-height: 1.35; color: #b9bdc4; max-width: 860px; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-family: 'Geist Mono', monospace; font-size: 24px; color: #9aa1ab; }
  .foot b { color: #f2b45b; font-weight: 500; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #f2b45b; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="frame">
    <div class="status"><span class="dot"></span>AI Engineering Intern at Thriftstone, Jul–Oct 2026</div>
    <div>
      <h1>Vinay Kumar Chopra</h1>
      <p class="pos">AI engineer building evaluation-first, grounded AI systems (RAG, agents, evals), with merged C and Python contributions to GRASS GIS.</p>
    </div>
    <div class="foot"><span>BITS Pilani · Computer Science</span><span><b>●</b> evals, failures and links on the page</span></div>
  </div>
</body>
</html>
