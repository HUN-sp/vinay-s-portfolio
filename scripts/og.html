<!doctype html>
<!-- Source for public/og.png. Render at 1200x630 (see README, "Open Graph image"). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Bricolage Grotesque'; src: url('../src/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Instrument Serif'; src: url('../src/assets/fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); font-style: normal; }
  @font-face { font-family: 'Instrument Serif'; src: url('../src/assets/fonts/instrument-serif-latin-400-italic.woff2') format('woff2'); font-style: italic; }
  @font-face { font-family: 'Geist'; src: url('../src/assets/fonts/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: linear-gradient(160deg, #f6fbff 0%, #d2e8fd 100%); color: #0b1224; font-family: 'Geist', sans-serif; position: relative; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); }
  .b1 { width: 420px; height: 420px; left: -120px; top: -120px; background: rgba(28,43,255,.18); }
  .b2 { width: 420px; height: 420px; right: -120px; bottom: -140px; background: rgba(255,122,26,.25); }
  .frame { position: absolute; inset: 0; padding: 64px 80px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 0; }
  .status { font-size: 24px; font-weight: 500; color: #36405a; display: inline-flex; align-items: center; gap: 14px; background: #fff; border: 1px solid #d3e2f3; padding: 12px 26px; border-radius: 999px; box-shadow: 0 10px 30px -12px rgba(28,43,255,.3); margin-bottom: 36px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff7a1a; box-shadow: 0 0 0 5px rgba(255,122,26,.15); }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -0.045em; white-space: nowrap; }
  .tag { margin-top: 22px; font-family: 'Instrument Serif', serif; font-size: 66px; line-height: 1.1; }
  .tag i { color: #1c2bff; }
  .pills { margin-top: 44px; display: flex; gap: 14px; }
  .pill { font-size: 24px; font-weight: 600; padding: 14px 30px; border-radius: 999px; }
  .p1 { background: #0b1224; color: #fff; } .p2 { background: #fff; border: 2px solid #aac2de; } .p3 { background: #ff7a1a; color: #1a0c00; }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="frame">
    <div class="status"><span class="dot"></span>AI Engineering Intern at Thriftstone, Jul–Oct 2026</div>
    <h1>Vinay Kumar Chopra</h1>
    <p class="tag">I build <i>grounded</i> AI systems.</p>
    <div class="pills"><span class="pill p1">RAG</span><span class="pill p2">Agents</span><span class="pill p3">Evals</span></div>
  </div>
</body>
</html>
